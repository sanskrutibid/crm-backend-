name: CRM Backend CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Code
        run: npm run build

  deploy-render:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Triggered if RENDER_DEPLOY_HOOK_URL secret is defined in GitHub settings
    if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "🚀 Triggering Render deployment..."
          curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Deploy request successfully sent to Render."

  deploy-vps:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Triggered if Host, User and SSH key secrets are defined in GitHub settings
    # Works identically for AWS EC2 or Hostinger VPS
    if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Deploy to Remote VPS (AWS EC2 / Hostinger) via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 SSH Connection established with VPS Server."
            cd ${{ secrets.VPS_DEPLOY_PATH || '~/crm-app-backend' }}
            
            echo "📥 Pulling latest codebase from main branch..."
            git pull origin main
            
            # --- Option A: Docker Deployment (Recommended) ---
            if [ -f docker-compose.yml ]; then
              echo "🐳 Rebuilding and starting Docker Containers..."
              docker compose down --remove-orphans
              docker compose up -d --build
              echo "✅ Docker container deployment finished successfully."
            
            # --- Option B: Direct PM2 Node.js Process Deployment (Fallback) ---
            else
              echo "📦 Running direct PM2 Node deployment..."
              npm install --production
              npm run build
              pm2 restart ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
              echo "✅ PM2 process deployment finished successfully."
            fi
